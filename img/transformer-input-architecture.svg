<svg xmlns="http://www.w3.org/2000/svg" width="880" height="519" viewBox="0 0 880 519" role="img" aria-labelledby="title"><title id="title">Transformer输入编码架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer输入编码架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#ffdddd" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">词元 ID</text><text x="440" y="125" font-size="16" fill="#000000">[B, L]：整数索引，补零位置另行标记</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#ffdddd" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">嵌入查表并缩放</text><text x="440" y="231" font-size="16" fill="#000000">Embedding [V, d] → [B, L, d] × √d</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">逐位置相加</text><text x="440" y="337" font-size="16" fill="#000000">词元向量 [B, L, d] + 位置向量 [1, L, d]</text><path d="M440 358V385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="388" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">随机失活</text><text x="440" y="443" font-size="16" fill="#000000">输出 [B, L, d]，送入编码器或解码器</text></g></svg>