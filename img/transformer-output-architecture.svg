<svg xmlns="http://www.w3.org/2000/svg" width="880" height="625" viewBox="0 0 880 625" role="img" aria-labelledby="title"><title id="title">Transformer输出预测架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer输出预测架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">解码器最终表示</text><text x="440" y="125" font-size="16" fill="#000000">[B, T, d]</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#cce8cc" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">词表线性投影</text><text x="440" y="231" font-size="16" fill="#000000">Wvocab [d, V]；得到 logits [B, T, V]</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">训练路径</text><text x="440" y="337" font-size="16" fill="#000000">logits + 右移后的标签 → CrossEntropy；忽略 PAD</text><rect x="160" y="388" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">推理路径</text><text x="440" y="443" font-size="16" fill="#000000">最后位置 logits → 选择下一词元 → 追加前缀</text><path d="M440 464V491" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="494" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="524" font-size="18" fill="#000000">停止条件</text><text x="440" y="549" font-size="16" fill="#000000">生成 EOS 或达到长度上限；不是所有位置一次生成</text><path d="M720 214H795V426H724" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /></g></svg>