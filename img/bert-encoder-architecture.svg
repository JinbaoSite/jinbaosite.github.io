<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title"><title id="title">BERT编码器架构图</title><rect width="800" height="520" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="black"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="black"><rect x="70" y="30" width="660" height="64" rx="3" fill="#eeeeee" stroke="black" stroke-width="1.2"/><text x="400" y="55" font-size="18">输入隐藏表示 H [B, L, d]</text><text x="400" y="79" font-size="15">各层参数独立；堆叠 N 次同结构编码器块</text><path d="M400 94V117" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="120" width="660" height="64" rx="3" fill="#ffddaa" stroke="black" stroke-width="1.2"/><text x="400" y="145" font-size="18">双向多头自注意力</text><text x="400" y="169" font-size="15">Q、K、V 均来自 H；所有有效词元可互相读取</text><path d="M400 184V207" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="210" width="660" height="64" rx="3" fill="#ffffcc" stroke="black" stroke-width="1.2"/><text x="400" y="235" font-size="18">随机失活、残差相加、层归一化</text><text x="400" y="259" font-size="15">A = LN(H + Dropout(Attention(H)))</text><path d="M400 274V297" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="300" width="660" height="64" rx="3" fill="#cceeff" stroke="black" stroke-width="1.2"/><text x="400" y="325" font-size="18">逐位置前馈网络</text><text x="400" y="349" font-size="15">Linear d → 4d；GELU；Linear 4d → d</text><path d="M400 364V387" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="390" width="660" height="64" rx="3" fill="#ffffcc" stroke="black" stroke-width="1.2"/><text x="400" y="415" font-size="18">随机失活、残差相加、层归一化</text><text x="400" y="439" font-size="15">H′ = LN(A + Dropout(FFN(A)))；形状保持 [B, L, d]</text></g></svg>