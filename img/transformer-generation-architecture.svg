<svg xmlns="http://www.w3.org/2000/svg" width="880" height="625" viewBox="0 0 880 625" role="img" aria-labelledby="title"><title id="title">Transformer自回归生成架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer自回归生成架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">源序列编码一次</text><text x="440" y="125" font-size="16" fill="#000000">保存编码器记忆 E 和源补零掩码</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#ffdddd" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">初始化目标前缀</text><text x="440" y="231" font-size="16" fill="#000000">[BOS]</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#ffddaa" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">解码当前前缀并取最后位置得分</text><text x="440" y="337" font-size="16" fill="#000000">读取 E；因果自注意力只看到已有目标词元</text><path d="M440 358V385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="388" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">选择下一词元并追加</text><text x="440" y="443" font-size="16" fill="#000000">贪心、束搜索或采样；[BOS, y₁, …, yt]</text><path d="M440 464V491" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="494" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="524" font-size="18" fill="#000000">检查终止</text><text x="440" y="549" font-size="16" fill="#000000">未结束则重新解码；已结束样本停止或追加 PAD</text></g></svg>