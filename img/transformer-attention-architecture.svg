<svg xmlns="http://www.w3.org/2000/svg" width="880" height="625" viewBox="0 0 880 625" role="img" aria-labelledby="title"><title id="title">Transformer缩放点积注意力架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer缩放点积注意力架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">单头查询、键和值</text><text x="440" y="125" font-size="16" fill="#000000">Q [B, Lq, dk]；K [B, Lk, dk]；V [B, Lk, dv]</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">查询与键做点积</text><text x="440" y="231" font-size="16" fill="#000000">QKᵀ → [B, Lq, Lk]</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">缩放并加入掩码</text><text x="440" y="337" font-size="16" fill="#000000">除以 √dk；禁止的键位置填为 −∞</text><path d="M440 358V385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="388" width="560" height="76" rx="3" fill="#ffddaa" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">沿键维执行 Softmax</text><text x="440" y="443" font-size="16" fill="#000000">权重 [B, Lq, Lk]；训练时可做注意力随机失活</text><path d="M440 464V491" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="494" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="524" font-size="18" fill="#000000">权重与值相乘</text><text x="440" y="549" font-size="16" fill="#000000">AV → [B, Lq, dv]</text></g></svg>