<svg xmlns="http://www.w3.org/2000/svg" width="880" height="625" viewBox="0 0 880 625" role="img" aria-labelledby="title"><title id="title">Transformer多头注意力架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer多头注意力架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">查询输入与上下文输入</text><text x="440" y="125" font-size="16" fill="#000000">查询长 Lq；上下文长 Lk；隐藏宽度 d</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">独立线性投影并拆分 H 个头</text><text x="440" y="231" font-size="16" fill="#000000">Q、K、V 的头宽 dk = d / H</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#ffddaa" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">各头并行执行缩放点积注意力</text><text x="440" y="337" font-size="16" fill="#000000">head₁、head₂、…、headH 各自读取上下文</text><path d="M440 358V385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="388" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">在特征维拼接</text><text x="440" y="443" font-size="16" fill="#000000">[B, Lq, H, dk] → [B, Lq, d]</text><path d="M440 464V491" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="494" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="524" font-size="18" fill="#000000">输出投影 Wᴼ</text><text x="440" y="549" font-size="16" fill="#000000">不同头的信息线性混合，保持 [B, Lq, d]</text></g></svg>