<svg xmlns="http://www.w3.org/2000/svg" width="880" height="519" viewBox="0 0 880 519" role="img" aria-labelledby="title"><title id="title">Transformer残差归一化架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer残差归一化架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">输入 x</text><text x="440" y="125" font-size="16" fill="#000000">[B, L, d]</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">子层与随机失活</text><text x="440" y="231" font-size="16" fill="#000000">Attention 或 FFN → Dropout</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">残差逐元素相加</text><text x="440" y="337" font-size="16" fill="#000000">z = x + Dropout(Sublayer(x))</text><path d="M440 358V385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="388" width="560" height="76" rx="3" fill="#ffffcc" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">逐位置层归一化</text><text x="440" y="443" font-size="16" fill="#000000">沿最后 d 维求均值方差，再做 γ、β 仿射变换</text><path d="M160 108.0H70V320.0H157" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="70" y="214.0" transform="rotate(-90 70 214.0)" font-size="15" fill="#000000">恒等路径 x</text></g></svg>