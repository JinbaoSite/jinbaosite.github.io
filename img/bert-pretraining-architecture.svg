<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title"><title id="title">BERT预训练输出架构图</title><rect width="800" height="430" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="black"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="black"><rect x="70" y="30" width="660" height="64" rx="3" fill="#eeeeee" stroke="black" stroke-width="1.2"/><text x="400" y="55" font-size="18">编码器输出 H [B, L, d]</text><text x="400" y="79" font-size="15">各位置隐藏向量共享主干，承担两类监督</text><path d="M400 94V117" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="120" width="660" height="64" rx="3" fill="#cceeff" stroke="black" stroke-width="1.2"/><text x="400" y="145" font-size="18">MLM 路径：被选位置的隐藏表示</text><text x="400" y="169" font-size="15">Linear → GELU → LayerNorm → 共享词表投影；恢复原词元</text><rect x="70" y="210" width="660" height="64" rx="3" fill="#ffddaa" stroke="black" stroke-width="1.2"/><text x="400" y="235" font-size="18">NSP 路径：[CLS] 隐藏表示</text><text x="400" y="259" font-size="15">Linear → Tanh 池化变换 → 二分类头；预测句段关系</text><path d="M400 274V297" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="300" width="660" height="64" rx="3" fill="#ffffcc" stroke="black" stroke-width="1.2"/><text x="400" y="325" font-size="18">联合预训练目标</text><text x="400" y="349" font-size="15">L = L_MLM + L_NSP；两项均按各自有效样本求均值</text><path d="M730 62H770V242H734" fill="none" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M70 152H30V332H66" fill="none" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/></g></svg>