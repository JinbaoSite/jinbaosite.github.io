<svg xmlns="http://www.w3.org/2000/svg" width="880" height="837" viewBox="0 0 880 837" role="img" aria-labelledby="title"><title id="title">Transformer解码器架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><rect x="120" y="70" width="620" height="742.0" rx="12" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><rect x="130" y="60" width="620" height="742.0" rx="12" fill="#eeeeee" stroke="#000000" stroke-width="1.2" /><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer解码器架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#ffdddd" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">右移目标输入 D</text><text x="440" y="125" font-size="16" fill="#000000">[B, T, d]；从 BOS 开始</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#ffddaa" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">因果自注意力</text><text x="440" y="231" font-size="16" fill="#000000">屏蔽未来键与目标补零键</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#ffffcc" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">随机失活 + 残差相加 + LayerNorm</text><text x="440" y="337" font-size="16" fill="#000000">得到目标前缀表示 A</text><path d="M440 358V385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="388" width="560" height="76" rx="3" fill="#ffddaa" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">交叉注意力</text><text x="440" y="443" font-size="16" fill="#000000">Q 来自 A；K、V 来自编码器记忆 E [B, S, d]</text><path d="M440 464V491" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="494" width="560" height="76" rx="3" fill="#ffffcc" stroke="#000000" stroke-width="1.2" /><text x="440" y="524" font-size="18" fill="#000000">随机失活 + 残差相加 + LayerNorm</text><text x="440" y="549" font-size="16" fill="#000000">得到源条件表示 C</text><path d="M440 570V597" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="600" width="560" height="76" rx="3" fill="#cceeff" stroke="#000000" stroke-width="1.2" /><text x="440" y="630" font-size="18" fill="#000000">逐位置前馈网络</text><text x="440" y="655" font-size="16" fill="#000000">d → dff → d</text><path d="M440 676V703" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="706" width="560" height="76" rx="3" fill="#ffffcc" stroke="#000000" stroke-width="1.2" /><text x="440" y="736" font-size="18" fill="#000000">随机失活 + 残差相加 + LayerNorm</text><text x="440" y="761" font-size="16" fill="#000000">输出 D′ [B, T, d]，继续堆叠 N 层</text><path d="M160 108.0H70V320.0H157" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="70" y="214.0" transform="rotate(-90 70 214.0)" font-size="15" fill="#000000">残差 D</text><path d="M160 320.0H70V532.0H157" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="70" y="426.0" transform="rotate(-90 70 426.0)" font-size="15" fill="#000000">残差 A</text><path d="M160 532.0H70V744.0H157" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="70" y="638.0" transform="rotate(-90 70 638.0)" font-size="15" fill="#000000">残差 C</text><text x="795" y="418.5" font-size="19" fill="#000000">N×</text></g></svg>