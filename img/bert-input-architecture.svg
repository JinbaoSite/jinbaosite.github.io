<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title"><title id="title">BERT输入表示架构图</title><rect width="800" height="340" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="black"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="black"><rect x="70" y="30" width="660" height="64" rx="3" fill="#ffdddd" stroke="black" stroke-width="1.2"/><text x="400" y="55" font-size="18">[CLS] 句段 A [SEP] 句段 B [SEP]</text><text x="400" y="79" font-size="15">词元 ID [B, L]；句段 ID [B, L]；位置 ID [L]</text><path d="M400 94V117" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="120" width="660" height="64" rx="3" fill="#cceeff" stroke="black" stroke-width="1.2"/><text x="400" y="145" font-size="18">三组可学习嵌入逐元素相加</text><text x="400" y="169" font-size="15">词元嵌入 + 句段嵌入 + 绝对位置嵌入 → [B, L, d]</text><path d="M400 184V207" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="70" y="210" width="660" height="64" rx="3" fill="#ffffcc" stroke="black" stroke-width="1.2"/><text x="400" y="235" font-size="18">层归一化与随机失活</text><text x="400" y="259" font-size="15">补零位置另有注意力掩码，不能按向量是否为零识别</text></g></svg>