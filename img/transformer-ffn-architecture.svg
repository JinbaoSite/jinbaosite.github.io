<svg xmlns="http://www.w3.org/2000/svg" width="880" height="519" viewBox="0 0 880 519" role="img" aria-labelledby="title"><title id="title">Transformer前馈网络架构图</title><rect width="100%" height="100%" fill="#fff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#000000" /></marker></defs><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="440" y="36" font-size="18" fill="#000000" font-weight="normal">Transformer前馈网络架构图</text><rect x="160" y="70" width="560" height="76" rx="3" fill="#ffdddd" stroke="#000000" stroke-width="1.2" /><text x="440" y="100" font-size="18" fill="#000000">输入表示</text><text x="440" y="125" font-size="16" fill="#000000">[B, L, d]；每个位置独立应用相同参数</text><path d="M440 146V173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="176" width="560" height="76" rx="3" fill="#cceeff" stroke="#000000" stroke-width="1.2" /><text x="440" y="206" font-size="18" fill="#000000">扩张投影</text><text x="440" y="231" font-size="16" fill="#000000">Linear：d → dff</text><path d="M440 252V279" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="282" width="560" height="76" rx="3" fill="#cceeff" stroke="#000000" stroke-width="1.2" /><text x="440" y="312" font-size="18" fill="#000000">非线性激活与训练随机失活</text><text x="440" y="337" font-size="16" fill="#000000">经典形式使用 ReLU；不混合序列位置</text><path d="M440 358V385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="160" y="388" width="560" height="76" rx="3" fill="#cceeff" stroke="#000000" stroke-width="1.2" /><text x="440" y="418" font-size="18" fill="#000000">压缩投影</text><text x="440" y="443" font-size="16" fill="#000000">Linear：dff → d；恢复残差所需宽度</text></g></svg>